name: Build PatchSampler v1.0.0 (Windows Full Standalone)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-standalone:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build PatchSampler Release
        run: cmake --build build --config Release --target PatchSampler

      - name: Upload PatchSampler EXE
        uses: actions/upload-artifact@v4
        with:
          name: PatchSampler-v1.0.0-Windows
          path: build/PatchSampler_artefacts/Release/PatchSampler.exe
